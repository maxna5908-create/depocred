<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#374151" />
    <title>DepoCred</title>
  </head>
  <body style="background-color: #374151; margin: 0; padding: 0;">
    <div id="root"></div>
    <div id="boot-error" style="display: none; color: white; text-align: center; font-family: system-ui, -apple-system, sans-serif; padding: 20px;">
      <h2>Ошибка запуска</h2>
      <p>Пожалуйста, перезапустите приложение.</p>
    </div>
    <script type="module" src="src/main.tsx"></script>
    <script>
      // Simple timeout to show error if nothing happens for 10 seconds
      setTimeout(() => {
        if (!document.getElementById('root').hasChildNodes()) {
          document.getElementById('boot-error').style.display = 'block';
        }
      }, 10000);
    </script>
  </body>
</html>
