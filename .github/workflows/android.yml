name: Native Android

on:
  push:
    branches: [feature/native-android]
    paths: [android/**, src/lib/version.ts, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, src/lib/version.ts, .github/workflows/android.yml]
  workflow_dispatch:
    inputs:
      release:
        description: Build signed APK and AAB using repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify calculators, storage and Android build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

  device:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-verification
          path: artifacts
      - name: Enable Android VM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native UI, storage and PDF on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 2560 -cores 2
          script: |
            adb install -t artifacts/outputs/apk/debug/app-debug.apk
            adb install -t artifacts/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell am instrument -w -r ru.depocred.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb logcat -d > device-logcat.txt
            adb exec-out run-as ru.depocred.app tar -C files -cf - qa > native-qa.tar
            grep -q 'OK (6 tests)' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-verification
          path: |
            instrumentation.txt
            device-logcat.txt
            native-qa.tar
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [verify, device]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEPOCRED_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure DEPOCRED signing secrets first.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/depocred.jks"
      - name: Signed APK and AAB
        working-directory: android
        env:
          DEPOCRED_KEYSTORE: ${{ runner.temp }}/depocred.jks
          DEPOCRED_KEY_ALIAS: key0
          DEPOCRED_STORE_PASSWORD: ${{ secrets.DEPOCRED_STORE_PASSWORD }}
          DEPOCRED_KEY_PASSWORD: ${{ secrets.DEPOCRED_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: depocred-signed-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/depocred.jks"
