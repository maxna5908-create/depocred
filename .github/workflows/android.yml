name: Native Android

on:
  push:
    branches: [feature/native-android]
    paths: [android/**, src/lib/version.ts, .github/workflows/android.yml]
  pull_request:
    paths: [android/**, src/lib/version.ts, .github/workflows/android.yml]
  workflow_dispatch:
    inputs:
      release:
        description: Build signed APK and AAB using repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify calculators, storage and Android build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEPOCRED_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure DEPOCRED signing secrets first.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/depocred.jks"
      - name: Signed APK and AAB
        working-directory: android
        env:
          DEPOCRED_KEYSTORE: ${{ runner.temp }}/depocred.jks
          DEPOCRED_KEY_ALIAS: key0
          DEPOCRED_STORE_PASSWORD: ${{ secrets.DEPOCRED_STORE_PASSWORD }}
          DEPOCRED_KEY_PASSWORD: ${{ secrets.DEPOCRED_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: depocred-signed-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/depocred.jks"
