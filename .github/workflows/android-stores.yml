name: Android stores
on:
  workflow_dispatch:
    inputs:
      google_play:
        description: Send this release to Google Play production review
        type: boolean
        default: false
      rustore:
        description: Send this release to RuStore moderation with automatic publication
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: depocred-android-stores
  cancel-in-progress: false
jobs:
  build:
    uses: maxna5908-create/depocred/.github/workflows/android.yml@feature/native-android
    with:
      release: true
      publish: ${{ inputs.google_play }}
      source_ref: feature/native-android
      track: production
      status: completed
      submit_review: true
    secrets: inherit
  rustore:
    if: inputs.rustore
    needs: build
    uses: maxna5908-create/depocred/.github/workflows/android-rustore.yml@feature/native-android
    with:
      source_run_id: ${{ github.run_id }}
    secrets: inherit
