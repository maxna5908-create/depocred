name: Native iOS

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      submit_review:
        description: Submit the uploaded build to App Review and release after approval
        type: boolean
        default: false
  push:
    branches: [feature/native-ios]
    paths: [ios/**, src/lib/version.ts, .github/workflows/ios.yml]
  pull_request:
    paths: [ios/**, src/lib/version.ts, .github/workflows/ios.yml]
  workflow_dispatch:
    inputs:
      release:
        description: Build signed IPA and upload to App Store Connect / TestFlight
        type: boolean
        default: false
      submit_review:
        description: Submit the uploaded build to App Review and release after approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'ios-release' || format('ios-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.depocred.app' }}
  IOS_APP_STORE_ID: ${{ vars.IOS_APP_STORE_ID || '6766194530' }}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'feature/native-ios' || github.sha }}
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report Apple configuration availability
        if: github.event_name != 'pull_request'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 ios/scripts/check_release_config.py --report-only
  verify:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Prepare Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 ios/scripts/configure.py
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec ios/project.yml
          mkdir -p ios/build
          xcrun simctl list devices available --json > ios/build/devices.json
          python3 ios/scripts/select_simulator.py ${{ matrix.device }} >> "$GITHUB_ENV"
      - name: Build and test on ${{ matrix.device }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcodebuild test -project ios/DepoCred.xcodeproj -scheme DepoCred -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ios/DerivedData \
            -resultBundlePath ios/build/Tests.xcresult -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/tests.log
      - name: Build device archive without signing
        if: matrix.device == 'phone'
        run: |
          set -euo pipefail
          xcodebuild archive -project ios/DepoCred.xcodeproj -scheme DepoCred -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ios/build/DepoCred-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/archive.log
      - name: Export screenshots and test summary
        if: always()
        run: |
          if [ -d ios/build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/screenshots || true
            xcrun xcresulttool get test-results summary --path ios/build/Tests.xcresult > ios/build/test-summary.json || true
          fi
          if [ -d ios/DerivedData/Build/Products/Debug-iphonesimulator/DepoCred.app ]; then
            ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/DepoCred.app ios/build/DepoCred-simulator.zip
          fi
          python3 ios/scripts/collect_store_assets.py ios/build/screenshots ios/build/store-assets
          python3 ios/scripts/report_test_results.py ios/build/test-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depocred-ios-report-${{ matrix.device }}
          path: |
            ios/build/test-summary.json
            ios/build/tests.log
            ios/build/archive.log
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depocred-ios-store-assets-${{ matrix.device }}
          path: ios/build/store-assets/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depocred-ios-verification-${{ matrix.device }}
          path: |
            ios/build/*.log
            ios/build/*.json
            ios/build/*.zip
            ios/build/screenshots/
            ios/build/store-assets/
            ios/build/Tests.xcresult/
            ios/DepoCred.xcodeproj/
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && (inputs.release || inputs.submit_review)
    needs: [source, verify]
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Prepare Xcode project
        run: |
          python3 ios/scripts/configure.py
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Sign, archive, export and upload to Apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash ios/scripts/release.sh
      - uses: ruby/setup-ruby@v1
        if: inputs.submit_review
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v5
        if: inputs.submit_review
        with:
          python-version: '3.12'
      - name: Prepare App Review tools
        if: inputs.submit_review
        run: |
          gem install fastlane -v 2.241.1 --no-document
          python -m pip install 'PyJWT[crypto]==2.10.1'
      - name: Submit exact build to App Review
        if: inputs.submit_review
        env:
          SUBMIT_REVIEW: 'true'
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: python ios/scripts/submit_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depocred-ios-app-store
          path: |
            ios/build/export/*.ipa
            ios/build/DepoCred.xcarchive/dSYMs/
            ios/build/release-summary.json
          retention-days: 30
